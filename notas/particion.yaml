# Partición de PEF-FallDB para calibración y prueba
#
# POR QUÉ EXISTE
# Todo lo que viene después del Paso 1 ajusta algo: umbrales, fronteras de
# banda, criterios de descarte. Medir esos ajustes sobre los mismos clips que
# los produjeron da un número que no se puede publicar. Este archivo fija de
# antemano qué clips no se tocan.
#
# POR ACTOR, NO POR CLIP
# Cada actor aporta 4 clips y tiene una sola clase. Partir por clip pondría al
# mismo sujeto de los dos lados, y el sistema se ajustaría a esa persona en vez
# de al fenómeno.
#
# LA REGLA, Y POR QUÉ ES UNA REGLA
# Dentro de cada clase, ordenar los actores por ID y tomar CADA TERCERO para
# prueba. Es arbitraria a propósito: cuando se escribió, ya se sabía qué
# actores fallaban (A06, A09, A14, B10 con 3 de 4 cada uno), y esa información
# no se puede des-ver. Una partición elegida a criterio habría quedado
# contaminada por ese conocimiento. Una regla mecánica sobre los IDs no puede
# estarlo.
#
# Verificación de que no quedó sesgada: la prueba se lleva el 31 % de los clips
# y el 27 % de los errores del 27/08. Ni fácil ni difícil de más.
#
# PROVISIONAL
# El §3.7 pide retener "settings, ubicaciones de cámara y condiciones de
# iluminación", no actores. El material tiene esas dimensiones pero aún no está
# anotado (ver CONVENCION-NOMBRES.md). Esta partición controla identidad del
# sujeto, que es MENOS de lo que el paper promete, y se reemplaza en cuanto el
# renombrado esté hecho. Hasta entonces NO debe reportarse como la partición
# del §3.7.

