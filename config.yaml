# =============================================================================
# PEF-Fall-Detector configuration
#
# Every tunable value of the detector lives here and only here: the code has no
# fallback values. Loading fails, naming the key, when a key is missing, unknown
# or of the wrong type (pef_fall_detector/config.py). Every run stores a copy of
# this file in its .meta.json, so a result always cites the values behind it.
#
# Units: _s and _seconds are seconds, _deg degrees, "torsos" torso lengths,
# _tps torso lengths per second. Windows are in seconds, never frames, so they
# mean the same at any frame rate.
# [EXP] marks what draft 4 does not describe: quantities A and H, and the leg
# extension deciding severity.
# Why each value is what it is (measurements, discarded options):
# notas/CONFIG-HISTORIA.md.
#
# Sections follow the §3.5 funnel: pose, records, Stage 1, Stage 2, Stage 3,
# the experimental quantities, alerts, and the display labels.
# =============================================================================

pose: # MediaPipe Pose front-end (§3.2)
  # 0 lite, 1 full (the §3.2 default, the model the Pi runs), 2 heavy.
  # Every calibrated value in this file was measured with 1.
  model_complexity: 1
  min_detection_confidence: 0.5 # MediaPipe: minimum score to accept a person detection
  min_tracking_confidence: 0.5 # MediaPipe: below this, tracking is dropped and it detects again
  smooth_landmarks: true # MediaPipe's own temporal smoothing
  # A landmark below this visibility is unreliable; a frame is reliable when its four core
  # landmarks (shoulders and hips) all reach it. Only reliable frames reach the funnel.
  visibility_threshold: 0.5
  # Core unreliable this long -> MediaPipe restarts and searches for the person again
  # (phase 4, A16-S1). Same value as stage1.history_max_gap_s. 0 disables.
  reacquire_after_s: 0.5

logging: # records (§3.5 auditability)
  output_dir: "logs" # a relative path is taken from the repository root
  # deployment: main.py records nothing (§3.6: the deployed detector persists nothing).
  # research: the per-frame record, the events and the 33 landmarks of every frame.
  # Dataset runs use research (main.py --mode research). PEF-Lab always records.
  mode: deployment # research | deployment

stage1: # kinematic trigger on T and V (§3.4, §3.5)
  threshold_T_deg: 45.0 # T: trunk inclination from vertical
  threshold_V: -1.5 # V: vertical velocity of the trunk centroid, tps; negative = down
  velocity_window_s: 0.167 # time span of V's derivative
  ema_time_constant_s: 0.1 # smoothing of the centroid before differentiating; 0 disables
  # A longer gap between samples restarts V's history (no derivative across a loss or a
  # seek), and a subject lost this long closes or abandons the pending event.
  history_max_gap_s: 0.5
  # score (default: T and V combined, V downward on that frame) | v_only (the §3.7
  # single-threshold ablation) | simultaneous | sequential (ablations, ablations.py)
  trigger_formulation: score
  # 'score': T/threshold_T_deg + V/threshold_V must reach this; 2.0 = both exactly at
  # threshold. Chosen on the train partition. Lower it where a missed fall is unacceptable.
  trigger_score: 2.6
  # Plausibility guard (§3.2): a trunk shorter than this share of its own recent median is
  # impossible geometry and T is left unmeasured. Loose on purpose: a real fall shortens it
  # to about 0.40. 0 disables.
  min_trunk_ratio: 0.15
  trunk_reference_window_s: 1.0 # span of that recent median
  trigger_hold_s: 0.1 # how long the condition must hold before Stage 1 fires (hysteresis)
  confirm_window_s: 1.0 # 'sequential' only: how long after V fires T may still confirm
  # How far back T and V may each come from: in a fall their peaks do not coincide.
  # 0.0 = both from the same frame, the literal §3.5 reading and its §3.7 ablation.
  trigger_peak_window_s: 0.8

stage2: # geometric verification on P (§3.4, §3.5)
  com_hip_weight: 0.65 # weight of the hip cluster in the COM (§3.4: hip-dominant); provisional
  # How long P is watched, from the trigger forward: the body is still falling when
  # Stage 1 fires.
  com_eval_window_s: 0.33
  # Share of the measurable frames in that window with the COM outside the support that
  # confirms the fall.
  com_outside_fraction: 0.5
  # Fewer measurable frames -> inconclusive, never rejected: occluded feet are not
  # evidence of no fall.
  com_min_samples: 3
  min_foot_visibility: 0.5 # feet below this are occluded and P is not measured
  # A foot landmark more than this above the lowest one (torsos) is off the floor and
  # not part of the support. Provisional.
  contact_band_torso: 0.15

stage3: # immobility confirmation on I, recovery and severity (§3.3, §3.4, §3.5)
  epsilon: 0.05 # I's stillness radius, torsos
  threshold_W_seconds: 5.0 # W (§3.4): immobility this long confirms the fall
  # Longest a verdict stays open; it closes earlier on a held recovery or when I reaches W.
  observation_window_seconds: 30.0
  upright_T_deg: 30.0 # trunk below this counts as upright (recovery)
  recovery_hold_seconds: 1.0 # upright this long is a recovery, not a wobble
  # [EXP] Tell mild (stood up) from moderate (only sat up) by the hip-to-ankle extension
  # (extension_ratio_EXP). false: every recovery is moderate, never mild.
  severity_uses_leg_extension: true
  cooldown_seconds: 3.0 # refractory period after an event resolves
  # false: a Stage-2 rejection returns to monitoring at once (a rejection is not a fall,
  # and the trigger's latch already prevents bursts). true = the behaviour before phase 4.
  cooldown_after_rejection: false
  persistent_still_s: 0.5 # a Stage-3 frame counts as still when I is at least this
  # §3.5 "if the immobility persists": an ending neither lying nor standing is severe when
  # at least this share of the Stage-3 frames were still (A17). 0 disables.
  persistent_immobility_fraction: 0.5
  # §3.5 "hip landmark recovery to upright": T ends down but the hip rose at least this
  # much (torsos) over the last getup_window_s -> getting up -> moderate. 0 disables.
  getup_rise_torsos: 0.45
  getup_window_s: 2.0

quantity_a: # [EXP] Quantity A (phase 8)
  # Head height above the ankles along gravity, from MediaPipe's 3D world landmarks, over
  # the same subject's standing height: ~1 standing, ~0.3-0.7 sitting or kneeling, ~0 on
  # the floor. 3D enters only through this self-calibrated ratio (§3.2 tension, C5).
  # Calibration, with the subject standing:
  standing_T_deg: 20.0 # trunk within this of vertical in the image
  standing_knee_deg: 150.0 # and mean 3D knee angle of both legs at least this (180 = straight)
  min_standing_s: 0.5 # standing time before A is defined (NaN until then)
  max_samples: 300 # standing frames kept for the calibration (~10 s at 30 fps)
  # Phase 8.2: the final posture comes from A when it is calibrated (otherwise from T).
  severity_from_a: true
  band_floor: 0.26 # final A at or below: on the floor -> severe
  band_standing: 0.82 # final A at or above: standing -> mild
  # Phase 8.3, "did it reach the floor?": if the head never went below floor_reached from
  # reach_before_s before to reach_after_s after the trigger, and the hip ended above
  # hip_raised, there was no fall (NoFall, no alarm). Abstains if A was not calibrated at
  # the trigger.
  reach_check: true
  floor_reached: 0.31
  hip_raised: 0.22 # the final hip must be at least this high (protects A17-S2)
  reach_before_s: 1.0
  reach_after_s: 4.0
  # Phase 8.4, an extra Stage-1 condition: the head drops from trigger_high or above to
  # trigger_low or below within trigger_window_s, with V < stage1.threshold_V on that frame,
  # held stage1.trigger_hold_s. Catches falls with the trunk vertical.
  trigger_from_a: true
  trigger_high: 0.7
  trigger_low: 0.3
  trigger_window_s: 1.5

experimental: # [EXP] Quantity H, body height ratio (pef_fall_detector/quantities/h.py)
  # Fallbacks OR'd into Stage 1 and Stage 3, never mixed into T and V. On; the values were
  # chosen for plausibility and have not been swept on PEF-FallDB. 0.0 disables each.
  # H decides: it raised 25 of the 90 Stage-1 events of phase 8.4 (cloud), 21 of 90 (Mac).
  height_baseline_time_constant_s: 2.0 # time constant of the personal standing height
  # Stage 1: H at or below this with V < stage1.threshold_V fires when the formulation does
  # not (falls along the camera axis). Stage 3: "lying" when T is not measured.
  trigger_H_ratio: 0.35
  # ...only if H was at or above this within trigger_H_sequence_window_s before (seen
  # standing). It cannot tell a fall from a deliberate crouch. 0.0 disables the requirement.
  trigger_H_erect: 0.85
  trigger_H_sequence_window_s: 2.0
  # Stage 3: H at or above this counts as upright for recovery when T does not.
  recovery_H_ratio: 0.75

alerts: # the §3.5 output (§3.6 transports)
  # Verdicts that send an alert: §3.5 dispatches a confirmed fall. Unresolved and
  # inconclusive events are recorded, not dispatched.
  dispatch_verdicts:
    - stage3_confirmed

state_display: # person-state labels for the GUI and the per-frame record
  # lying_T_deg, standing_extension, max_extension_ratio and ratio_time_constant_s also
  # feed Stage 3; the other four are display only.
  transition_v_tps: 0.7 # |V| above this (tps) -> TRANSITION
  lying_T_deg: 60.0 # trunk at or above this -> LYING (Stage 3: down)
  leaning_T_deg: 15.0 # trunk at or above this with legs extended -> LEANING
  standing_extension: 1.1 # hip-to-ankle extent over torso at or above -> legs extended
  crouch_extension: 0.6 # below this -> legs collapsed (CROUCHING)
  walking_vh_tps: 0.25 # |horizontal V| above this while upright -> WALKING
  max_extension_ratio: 3.0 # above this the ratio is not a leg (foreshortened torso): NaN
  ratio_time_constant_s: 0.1 # smoothing of the finished extension ratio; 0 disables
